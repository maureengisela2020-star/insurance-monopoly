<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>1-1 Insurance Monopoly</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{--bg:#0b1020;--panel:#121a33;--line:#243056;--tx:#e2e8f0}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-tap-highlight-color:transparent}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);max-width:460px;margin:0 auto}
.gb{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);gap:3px;aspect-ratio:1}
.tile{position:relative;border-radius:8px;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;line-height:1.15;text-align:center;padding:2px 1px 9px;overflow:hidden}
.tile .ic{font-size:19px}
.tile.on{background:#1b2650}
.tk{position:absolute;bottom:2px;left:0;right:0;display:flex;justify-content:center;gap:3px}
.tk i{width:10px;height:10px;border-radius:50%;box-shadow:0 0 7px 2px currentColor;background:currentColor}
@keyframes pop{from{transform:scale(.5) rotate(-90deg)}to{transform:none}}
.dice{animation:pop .3s}
#portal{background:#fff;color:#111}
#portal input[type=range]{accent-color:#cc0000;width:100%}
.hd{font-style:italic;font-weight:900;letter-spacing:-.02em}
.cube{width:46px;height:46px;position:relative;transform-style:preserve-3d}
.cf{position:absolute;inset:0;background:linear-gradient(135deg,#fff,#cbd5e1);border-radius:9px;display:grid;grid:repeat(3,1fr)/repeat(3,1fr);padding:6px;box-shadow:inset 0 0 6px rgba(0,0,0,.25)}
.cf i{width:8px;height:8px;border-radius:50%;margin:auto;background:#0f172a}
.cf.f1 i{background:#ef4444;width:10px;height:10px}
.f1{transform:translateZ(23px)}.f2{transform:rotateY(90deg) translateZ(23px)}.f3{transform:rotateX(90deg) translateZ(23px)}
.f4{transform:rotateX(-90deg) translateZ(23px)}.f5{transform:rotateY(-90deg) translateZ(23px)}.f6{transform:rotateY(180deg) translateZ(23px)}
@media(prefers-reduced-motion:reduce){.dice{animation:none}}
</style>
</head>
<body>
<div id="app"></div>

<!-- Game modal -->
<div id="modal" class="hidden fixed inset-0 z-40 bg-black/70 flex items-center justify-center p-4">
  <div id="mbody" class="w-full max-w-[380px] max-h-[88vh] overflow-auto rounded-2xl bg-slate-900 border border-slate-600 p-5"></div>
</div>

<!-- Cardif portal -->
<div id="portal" class="hidden fixed inset-0 z-50 overflow-auto"></div>
<div id="apply" class="hidden fixed inset-0 z-[60] bg-black/70 flex items-center justify-center p-4"></div>
<div id="toast" role="status" class="hidden fixed top-16 left-1/2 -translate-x-1/2 z-[70] w-[calc(100%-1.5rem)] max-w-[420px] pointer-events-none rounded-xl border-2 px-4 py-3 text-sm bg-slate-900/95 shadow-2xl" style="border-color:#ec4899"></div>

<script>
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const n=x=>Math.round(x).toLocaleString('en-US'), m=x=>'NT$'+n(x);
const C=['#06b6d4','#ec4899'];
let lang='zh',mode=1,G=null,modalFn=null,busy=false,B=300,LM=500000,won=false;
const L=a=>a[lang=='en'?0:1], b=(e,z)=>lang=='en'?e:z;

// ★ Replace with real branch / advisor details
const CFG={name:['Cardif Douliu Service Center','Cardif 斗六服務據點'],addr:['(Fill in address) Douliu City, Yunlin County','(請填入地址)雲林縣斗六市'],phone:'05-XXX-XXXX',line:'https://line.me/R/ti/p/@your_advisor_id',hours:['Mon–Fri 09:00–18:00','週一至週五 09:00–18:00']};

const U={title:['1-1 Insurance Monopoly','1-1 保險大富翁'],lap:['Lap','第'],on:['Cardif ON','保障中'],off:['Uninsured','未投保'],roll:['Roll dice','擲骰子'],ok:['Continue','繼續'],aiTurn:['AI is rolling…','AI 擲骰中…'],log:['Activity log','活動紀錄']};
const u=k=>L(U[k]);

// type, icon, [name], prob/amount, [hit story], [safe story]
const TL=[
['start','🏁',['START +8,000','起點 +8,000']],
['risk','🛵',['Scooter Commute','騎車通勤'],.2,['A truck cuts you off on the commute. You fall and need X-rays and stitches.','通勤時被貨車逼車而摔車,需要X光與縫合。'],['Smooth ride to campus today.','今天通勤一路順暢。']],
['chance','🎲',['CHANCE · AI Risk','機會・AI風險']],
['hub','🛡️',['Cardif Hub','Cardif 保障站']],
['sport','🏀',['Late-Night Sports','夜間運動']],
['safe','🏥',['Health Center','校園健康中心']],
['gap','💸',['NHI Coverage Gap','健保自費缺口'],.3,['A private ward upgrade and imaging are not covered by NHI.','自費病房差額與影像檢查不在健保給付內。'],['NHI covers your visit this time.','這次健保已涵蓋就診費用。']],
['job','💼',['Part-Time Shift +1,500','打工班表 +1,500'],1500],
['risk','🌧️',['Rainy Scooter Slip','雨天機車打滑'],.2,['Your scooter slides on wet tiles at the crosswalk.','斑馬線濕滑,機車打滑摔倒。'],['You brake early on the wet road.','你在雨天提早減速,平安通過。']],
['claim','📋',['Cardif Claim Station','Cardif 理賠站']],
['risk','🦶',['Sports Injury','運動傷害'],.25,['Ankle sprain on the court: cast and weeks of therapy.','球場扭傷腳踝,需打石膏與數週復健。'],['Great game, no injuries.','球賽順利,毫髮無傷。']],
['market','🍢',['Night Market -300','夜市小吃 -300']],
['risk','😵',['Cram & Burnout','期中狂K倦怠'],.2,['Midterm all-nighters lead to a fever and a clinic visit.','期中熬夜到發燒,必須就診。'],['You kept a healthy sleep schedule.','你保持了良好作息。']],
['job','🎁',['Part-Time Bonus +1,000','打工獎金 +1,000'],1000],
['gap','🚑',['Emergency Clinic','急診就醫'],.3,['A late-night ER visit leaves a big self-paid gap.','深夜急診,留下一大筆自費缺口。'],['A quick visit, mostly covered by NHI.','短暫就診,健保幾乎全額給付。']],
['finish','🏆',['FINISH · Lap Review','終點・圈次回顧']]];
const COL={start:'#22c55e',risk:'#ef4444',gap:'#f97316',chance:'#a855f7',hub:'#06b6d4',claim:'#06b6d4',safe:'#10b981',job:'#eab308',sport:'#38bdf8',market:'#f472b6',finish:'#22c55e'};
const SC=[
{at:[1,8],t:['Rainy Scooter Slip near YunTech','雲科大校門雨天機車打滑'],s:['Your scooter slides on wet asphalt near the YunTech gates. Medical bills and bike repairs add up.','在雲科大校門口雨天路滑,機車打滑摔倒,醫療與修車費用一起來。'],c:10000},
{at:[10],t:['Late-Night Basketball Ankle Sprain','夜間打球扭傷腳踝'],s:['You land badly after a rebound and sprain your ankle. Physical therapy is mostly self-paid.','搶籃板落地時扭傷腳踝,復健治療多為自費。'],c:4500},
{at:[12],t:['Cram School Overwork & High Fever','補習過勞突發高燒'],s:['After cram school and an all-nighter, a sudden high fever sends you to the clinic for an IV drip.','補習加熬夜後突然高燒,到診所打點滴。'],c:6000},
{at:[6,14],t:['Night Market Food Poisoning','夜市食物中毒'],s:['Something at the night market did not agree with you. Emergency outpatient visit at midnight.','夜市小吃吃壞肚子,半夜掛急診門診。'],c:3500},
{at:[6,14],t:['Cafeteria Wet Floor Slip','學生餐廳地板濕滑'],s:['You slip on a wet cafeteria floor and hurt your wrist. X-ray and treatment follow.','在學生餐廳滑倒傷到手腕,需要X光與治療。'],c:8000},
{at:[1,8,14],t:['Scooter Collision at Intersection','路口機車擦撞'],s:['A car runs the light and clips your scooter at an intersection. Emergency care is needed.','路口被闖紅燈的汽車撞上機車,必須緊急送醫。'],c:12000}];

const pn=p=>p.ai?['AI','AI 對手']:['Player '+p.i,'玩家 '+p.i];
const gp=i=>i<=4?[1,i+1]:i<=7?[i-3,5]:i<=12?[5,13-i]:[17-i,1];
const cost=()=>Math.round((3000+Math.random()*9000)/100)*100;
function lg(p,e,z){G.n=(G.n||0)+1;G.log.unshift([pn(p)[0]+': '+e,pn(p)[1]+':'+z]);G.log.length=Math.min(G.log.length,30)}

/* ---------- Render ---------- */
const FR={1:[0,0],2:[0,-90],3:[-90,0],4:[90,0],5:[0,90],6:[0,180]};
const PIPS={1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]};
function diceHTML(){const f=G.face||1,[rx,ry]=FR[f];
  return `<div style="perspective:260px;height:52px" class="flex items-center"><div id="cube" class="cube" style="transform:rotateX(${rx}deg) rotateY(${ry}deg)">${[1,2,3,4,5,6].map(k=>`<div class="cf f${k}">${[1,2,3,4,5,6,7,8,9].map(c=>PIPS[k].includes(c)?'<i></i>':'<b></b>').join('')}</div>`).join('')}</div></div>
  <div class="text-[11px] font-bold h-3.5">${G.d?b('Rolled ','點數 ')+G.d:''}</div>`}
function render(){
  let h=`<header class="sticky top-0 z-30 flex items-center justify-between px-3 py-2 bg-[#0b1020]/95 border-b border-slate-700">
  <div><div class="font-extrabold text-[15px]">🛡️ ${u('title')}</div>${G?`<div class="text-[10px] text-slate-400">${L(U.lap)} ${b('','')}${Math.min(G.P[G.t].laps+1,3)}/3 ${b('','圈')}</div>`:''}</div>
  <button onclick="tl()" aria-label="Language" class="flex text-xs font-bold rounded-full border border-slate-600 overflow-hidden">
  <span class="px-3 py-1.5 ${lang=='en'?'bg-cyan-500 text-slate-900':''}">EN</span><span class="px-3 py-1.5 ${lang=='zh'?'bg-cyan-500 text-slate-900':''}">中文</span></button></header>`;
  if(!G){$('app').innerHTML=h;return}
  const cp=G.P[G.t];
  h+=`<main class="p-2"><div class="gb">`;
  TL.forEach((t,i)=>{const [r,c]=gp(i),here=G.P.filter(p=>p.pos==i);
    h+=`<div class="tile ${here.some(p=>p===cp)?'on':''}" style="grid-area:${r}/${c};--c:${COL[t[0]]}"><span class="ic">${t[1]}</span><span>${L(t[2])}</span><span class="absolute top-0 left-1 text-[8px] text-slate-500">${i+1}</span><div class="tk">${here.map(p=>`<i style="color:${C[p.i-1]}"></i>`).join('')}</div></div>`});
  h+=`<div class="rounded-xl bg-slate-900 border-2 flex flex-col items-center justify-center gap-1 p-2" style="grid-area:2/2/5/5;border-color:${C[G.t]}">
   <div class="text-[11px] text-slate-400">${b('Now rolling','目前回合')}</div>
   <div class="text-lg font-extrabold" style="color:${C[G.t]};text-shadow:0 0 10px ${C[G.t]}">${L(pn(cp))}</div>
   ${diceHTML()}
   <button onclick="roll()" ${busy||cp.ai?'disabled':''} class="px-5 py-2 rounded-xl font-bold text-sm text-slate-900 disabled:opacity-40" style="background:${C[G.t]}">${cp.ai&&busy?u('aiTurn'):u('roll')}</button></div></div>
  <section class="grid grid-cols-2 gap-2 mt-2">`;
  G.P.forEach((p,k)=>{h+=`<div class="rounded-xl p-2.5 bg-slate-900 border-2" style="border-color:${G.t==k&&!p.done?C[k]:'#243056'}">
   <div class="flex justify-between text-xs font-bold" style="color:${C[k]}"><span>${L(pn(p))}${p.done?' ✔':''}</span><span class="${p.ins?'':'text-slate-500'}">${p.ins?'🛡️ '+u('on'):u('off')}</span></div>
   <div class="text-lg font-extrabold">${m(p.cash)}</div>
   <div class="text-[10px] text-slate-400">${b('Lap ','第 ')}${Math.min(p.laps+1,3)}/3 · ⭐ ${p.pts}</div></div>`});
  h+=`</section><section class="mt-2 rounded-xl bg-slate-900 border border-slate-700 p-2.5"><div class="text-[11px] font-bold text-slate-400 mb-1">${u('log')}</div><div class="text-[11px] space-y-1 max-h-40 overflow-auto">${G.log.slice(0,8).map(x=>`<div class="text-slate-300">• ${L(x)}</div>`).join('')}</div></section></main>`;
  $('app').innerHTML=h;
}
function tl(){lang=lang=='en'?'zh':'en';document.documentElement.lang=lang=='en'?'en':'zh-Hant';render();if(modalFn)modalFn();if(!$('portal').classList.contains('hidden'))portal();if(!$('apply').classList.contains('hidden'))applyM()}

/* ---------- Modals ---------- */
function modal(h){$('mbody').innerHTML=h;$('modal').classList.remove('hidden')}
function closeM(){$('modal').classList.add('hidden');modalFn=null}
function ask(ic,tt,bd,bt,auto){return new Promise(res=>{
  const done=v=>{closeM();res(v)};
  modalFn=()=>{modal(`<div class="text-center"><div class="text-5xl">${ic}</div><h3 class="text-lg font-bold mt-2">${L(tt)}</h3><p class="text-sm text-slate-300 mt-2 leading-relaxed">${L(bd)}</p><div class="flex gap-2 mt-4">${bt.map((x,i)=>`<button id="b${i}" class="flex-1 py-2.5 rounded-xl font-bold ${i?'bg-slate-700':'bg-cyan-500 text-slate-900'}">${L(x[0])}</button>`).join('')}</div></div>`);bt.forEach((x,i)=>$('b'+i).onclick=()=>done(x[1]))};
  modalFn();if(auto!==undefined)setTimeout(()=>done(auto),1700)})}
let tT;
function toast(h){const t=$('toast');t.innerHTML=h;t.classList.remove('hidden');clearTimeout(tT);tT=setTimeout(()=>t.classList.add('hidden'),2000)}
function ev(p,ic,tt,bd){
  if(!p.ai)return ask(ic,tt,bd,[[U.ok,1]]);
  const r=G.n>G.n0?L(G.log[0]).replace(/^[^:\uff1a]*[:\uff1a]\s*/,''):L(bd);
  toast(`<div class="font-bold" style="color:${C[1]}">${ic} ${L(pn(p))} ${b('landed on','停在')} ${L(TL[p.pos][2])}</div><div class="text-xs text-slate-300 mt-0.5">${r}</div>`);
  return sleep(600)}

function startM(){modalFn=()=>modal(`<div class="text-center"><div class="text-5xl">🛡️🎲</div><h2 class="text-xl font-extrabold mt-2">${u('title')}</h2>
<p class="text-sm text-slate-400 mt-1">${b('3 laps · NT$8,000 start · protect your cash!','3 圈賽制・起始 NT$8,000・守住你的錢包!')}</p>
<button onclick="init(1)" class="w-full mt-4 py-3 rounded-xl font-bold bg-cyan-500 text-slate-900">🤖 ${b('1 Player vs AI','單人對戰 AI')}</button>
<button onclick="init(2)" class="w-full mt-2 py-3 rounded-xl font-bold bg-pink-500 text-slate-900">👥 ${b('2 Players · Pass-and-Play','雙人同機輪流')}</button>
<p class="text-[11px] mt-3"><span style="color:${C[0]}">● ${b('Player 1','玩家 1')}</span> &nbsp; <span style="color:${C[1]}">● ${b('Player 2 / AI','玩家 2 / AI')}</span></p></div>`);modalFn()}
function init(k){mode=k;busy=false;
  G={P:[1,2].map(i=>({i,ai:k==1&&i==2,cash:8000,pos:0,laps:0,ins:false,pts:0,cl:0,pd:0,done:false})),t:0,d:0,log:[]};
  closeM();lg(G.P[0],'Game start! NT$8,000 each.','遊戲開始!每人起始 NT$8,000。');render()}

/* ---------- Game flow ---------- */
async function roll(){
  if(busy||!G)return;busy=true;const p=G.P[G.t];
  const d=1+Math.floor(Math.random()*6),[rx,ry]=FR[d];G.d=0;render();
  const cu=$('cube');cu.style.transition='none';void cu.offsetWidth;
  cu.style.transition='transform .8s cubic-bezier(.12,.75,.2,1)';
  cu.style.transform=`rotateX(${rx+720}deg) rotateY(${ry+1080}deg)`;
  await sleep(850);G.d=d;G.face=d;render();await sleep(250);
  for(let s=0;s<G.d;s++){p.pos++;if(p.pos>=16){p.pos=0;p.laps++;p.cash+=8000;
      lg(p,'Passed START: +NT$8,000 allowance.','經過起點:領取生活費 +NT$8,000。');
      if(p.ins){p.cash-=200;p.pd+=200;lg(p,'Cardif premium -NT$200 (per lap).','Cardif 保費 -NT$200(每圈)。')}
      render();if(p.laps>=3)break}
    render();await sleep(210)}
  await land(p);
  if(p.laps>=3)p.done=true;
  if(G.P.every(x=>x.done))return finish();
  do{G.t=(G.t+1)%G.P.length}while(G.P[G.t].done);
  busy=false;render();
  if(G.P[G.t].ai){busy=true;render();await sleep(700);busy=false;roll()}
}
async function hit(p,pos){
  const pool=pos==2?SC:SC.filter(x=>x.at.includes(pos)),sc=pool[Math.floor(Math.random()*pool.length)],t=sc.t,story=sc.s,c=sc.c;
  if(p.ins){p.cl+=c;lg(p,`${t[0]}: Cardif paid ${m(c)} in full. Loss NT$0.`,`${t[1]}:Cardif 全額理賠 ${m(c)},損失 NT$0。`);
    await ev(p,'🛡️',t,[story[0]+` Cardif pays 100% (${m(c)}). Your loss: NT$0.`,story[1]+` Cardif 100% 理賠(${m(c)}),你的損失:NT$0。`])}
  else{p.cash-=c;lg(p,`${t[0]}: out-of-pocket -${m(c)}.`,`${t[1]}:自費支出 -${m(c)}。`);
    await ev(p,'💥',t,[story[0]+` No coverage: you pay ${m(c)} yourself.`,story[1]+` 未投保:你需自付 ${m(c)}。`])}
  render()}
async function land(p){
  G.n0=G.n||0;const T=TL[p.pos],ty=T[0],nm=T[2];
  if(ty=='risk'||ty=='gap'){
    if(Math.random()<T[3])await hit(p,p.pos);
    else{if(ty=='risk'&&p.pos==10){}lg(p,nm[0]+': safe.',nm[1]+':平安無事。');await ev(p,'✅',nm,T[5])}}
  else if(ty=='chance'){const r=Math.random();
    if(r<.35)await hit(p,2);
    else if(r<.6){p.cash+=2000;lg(p,'AI event: scholarship +NT$2,000.','AI事件:獲得獎學金 +NT$2,000。');await ev(p,'🎓',TL[2][2],['AI pushes a notice: you won a campus study grant! +NT$2,000.','AI推播通知:你獲得校內獎學金!+NT$2,000。'])}
    else{lg(p,'AI event: a calm day.','AI事件:平靜的一天。');await ev(p,'☀️',TL[2][2],['The AI risk radar finds nothing today. Stay alert!','AI風險雷達今天沒有警示,繼續保持警覺!'])}}
  else if(ty=='hub'){
    if(p.ins)await ev(p,'🛡️',nm,['Cardif Youth Coverage is active. NT$200 is deducted each lap at START.','Cardif 青年保障已啟用,每圈經過起點自動扣 NT$200。']);
    else{const yes=p.ai?Math.random()<.8:await ask('🛡️',nm,['Activate Cardif Youth Coverage for NT$200 per lap? Accidents and medical gaps are paid 100% while active.','啟用 Cardif 青年保障,每圈 NT$200?啟用期間意外與醫療缺口 100% 理賠。'],[[['Activate','啟用保障'],1],[['Skip','先不要'],0]]);
      if(yes){p.ins=true;lg(p,'Activated Cardif coverage.','啟用 Cardif 保障。')}else lg(p,'Skipped insurance.','選擇不投保。')}}
  else if(ty=='safe'){p.pts+=2;lg(p,'Health Center check-up: +2 lifestyle pts.','健康中心檢查:生活點數 +2。');await ev(p,'🏥',nm,['Free basic care and a health check. Safe zone! +2 lifestyle points.','免費基礎診療與健康檢查,安全區!生活點數 +2。'])}
  else if(ty=='sport'){p.pts+=1;lg(p,'Night basketball: +1 lifestyle pt.','夜間打球:生活點數 +1。');await ev(p,'🏀',nm,['A fun late-night game with friends. +1 lifestyle point.','和朋友夜間打球很開心,生活點數 +1。'])}
  else if(ty=='job'){p.cash+=T[3];lg(p,`Part-time income +${m(T[3])}.`,`打工收入 +${m(T[3])}。`);await ev(p,'💰',nm,[`You earned ${m(T[3])}.`,`你賺到 ${m(T[3])}。`])}
  else if(ty=='market'){p.cash-=300;p.pts+=2;lg(p,'Night market -NT$300, +2 pts.','逛夜市 -NT$300,生活點數 +2。');await ev(p,'🍢',nm,['Fried chicken and bubble tea! -NT$300, +2 lifestyle points.','鹽酥雞配珍奶!-NT$300,生活點數 +2。'])}
  else if(ty=='claim'){if(p.ins)p.pts+=1;
    lg(p,`Claim review: protected ${m(p.cl)}, premiums ${m(p.pd)}.`,`理賠檢視:已理賠 ${m(p.cl)},已繳保費 ${m(p.pd)}。`);
    await ev(p,'📋',nm,p.ins?[`Financial review: Cardif has paid ${m(p.cl)} so far vs ${m(p.pd)} in premiums. +1 pt.`,`財務檢視:Cardif 已理賠 ${m(p.cl)},你已繳保費 ${m(p.pd)}。生活點數 +1。`]:['Financial review: no coverage active, so every accident comes out of your cash. Visit the Cardif Hub!','財務檢視:目前未投保,所有意外都得自掏腰包。快去 Cardif 保障站!'])}
  else if(ty=='finish'){lg(p,`Lap review: cash ${m(p.cash)}.`,`圈次回顧:現金 ${m(p.cash)}。`);await ev(p,'🏆',nm,[`Lap review: you hold ${m(p.cash)} and ${p.pts} lifestyle points.`,`圈次回顧:你有 ${m(p.cash)} 與 ${p.pts} 生活點數。`])}
  render()}

/* ---------- Summary ---------- */
const sc=p=>p.cash+p.pts*50+(p.ins?5000:0);
function finish(){
  busy=false;const s=G.P.map(sc),mx=Math.max(...s),w=G.P.filter((p,i)=>s[i]==mx);
  const tie=w.length>1,wp=w[0];won=!tie&&!wp.ai;
  const title=tie?['Game Complete: Tie!','遊戲結束:平手!']:wp.ai?['Game Complete!','遊戲結束!']:[pn(wp)[0]+' Wins!',pn(wp)[1]+' 獲勝!'];
  modalFn=()=>modal(`<div class="text-center"><div class="text-5xl">${won?'🏆':'🏁'}</div><h2 class="text-2xl font-black mt-1">${L(title)}</h2>
  ${mode==1&&wp.ai&&!tie?`<p class="text-xs text-slate-400">${b('The AI scored higher this time. Try again!','這次 AI 分數較高,再試一次!')}</p>`:''}</div>
  <div class="mt-3 space-y-2">${G.P.map((p,i)=>`<div class="rounded-xl p-3 bg-slate-800 border-2 text-xs" style="border-color:${C[i]}"><div class="flex justify-between font-bold text-sm" style="color:${C[i]}"><span>${L(pn(p))}</span><span>${n(s[i])} ${b('pts','分')}</span></div>
  <div class="mt-1 text-slate-300 flex justify-between"><span>${b('Remaining cash','剩餘現金')}</span><span>${m(p.cash)}</span></div>
  <div class="text-slate-300 flex justify-between"><span>${b('Lifestyle ','生活點數 ')}${p.pts} × 50</span><span>${n(p.pts*50)}</span></div>
  <div class="text-slate-300 flex justify-between"><span>${b('Risk Resilience Bonus','風險韌性加分')}</span><span>${p.ins?'+5,000':'0'}</span></div>
  <div class="text-slate-500 text-[10px] mt-1">${b('Claims paid','累計理賠')} ${m(p.cl)} · ${b('Premiums','累計保費')} ${m(p.pd)}</div></div>`).join('')}</div>
  <p class="text-[10px] text-slate-500 mt-2">${b('Score = Cash + Lifestyle × 50 + 5,000 if insured','總分 = 現金 + 生活點數 × 50 + 已投保 5,000')}</p>
  ${won?`<div class="mt-3 text-center text-xs font-bold rounded-lg py-1.5 bg-yellow-400 text-slate-900">🎟️ ${b('Claim 20% OFF First 3 Months Voucher','領取前 3 個月 8 折優惠券')}</div>`:''}
  <button onclick="portal(true)" class="w-full mt-2 py-3 rounded-xl font-extrabold text-white bg-red-600">${b('Go to Official Cardif Product Portal','前往 Cardif 官方產品專區')}</button>
  <button onclick="startM()" class="w-full mt-2 py-2.5 rounded-xl font-bold bg-slate-700">${b('Play again','再玩一次')}</button>`);
  modalFn()}

/* ---------- Cardif Portal (Honda-style: black / white / racing red) ---------- */
function portal(open){
  if(open){closeM();$('portal').classList.remove('hidden')}
  const spec=(k,v)=>`<div class="flex justify-between border-b border-neutral-300 py-2 text-sm"><span class="text-neutral-600">${k}</span><span class="font-bold">${v}</span></div>`;
  $('portal').innerHTML=`
  <div class="max-w-[460px] mx-auto">
  <div class="sticky top-0 z-10 bg-black text-white flex items-center justify-between px-4 py-3" style="padding-top:calc(.75rem + env(safe-area-inset-top,0px))">
    <div class="flex items-center gap-2 font-black tracking-widest"><span class="inline-block w-5 h-5 bg-red-600" style="clip-path:polygon(0 0,100% 0,60% 100%,0 100%)"></span>CARDIF</div>
    <div class="flex items-center gap-2"><button onclick="tl()" class="text-xs border border-neutral-500 px-2 py-1">${b('中文','EN')}</button>
    <button onclick="closeP()" class="text-xs font-bold bg-red-600 px-3 py-1.5">${b('Back to Game','返回遊戲')}</button></div></div>
  <section class="bg-black text-white px-5 pt-10 pb-12 relative overflow-hidden">
    <div class="absolute -right-16 top-0 h-full w-40 bg-red-600" style="transform:skewX(-18deg)"></div>
    <div class="relative"><p class="text-xs text-neutral-400">${b('Cardif Youth Health','Cardif 青年健康保障')}</p>
    <h1 class="hd text-4xl leading-tight mt-2">${b('Ride on.<br>Stay covered.','放心騎。<br>安心學。')}</h1>
    <p class="text-sm text-neutral-300 mt-3 w-4/5">${b('Student accident and medical protection built for scooters, courts and late nights.','為機車通勤、球場與熬夜日常設計的學生意外與醫療保障。')}</p>
    ${won?`<div class="inline-block mt-4 bg-yellow-400 text-black text-xs font-black px-3 py-1.5">🎟️ ${b('20% OFF First 3 Months unlocked','前 3 個月 8 折已解鎖')}</div>`:''}
    <div><a href="#calc" class="inline-block mt-4 bg-red-600 px-5 py-2.5 text-sm font-bold">${b('Calculate my payout','試算我的理賠')}</a></div></div></section>

  <section class="px-5 py-8"><h2 class="hd text-2xl">${b('Youth Health Showcase','青年健康保障一覽')}</h2>
  <p class="text-[11px] text-neutral-500 mt-1">${b('Sample specs for illustration; actual terms follow the policy.','以下為示意規格,實際以保單條款為準。')}</p>
  <div class="mt-4 border-t-4 border-red-600 bg-neutral-100 p-4"><h3 class="font-black text-lg">${b('Student Personal Accident','學生個人傷害險')}</h3>
   ${spec(b('Accident death / disability','意外身故/失能'),b('up to NT$1,000,000','最高 NT$1,000,000'))}${spec(b('Accident medical reimbursement','意外醫療實支實付'),b('Receipt-based','憑收據給付'))}${spec(b('Daily hospital allowance','住院日額'),b('Per day of stay','依住院天數'))}${spec(b('Typical cases','常見情境'),b('Scooter, sports','機車、運動'))}</div>
  <div class="mt-4 border-t-4 border-black bg-neutral-100 p-4"><h3 class="font-black text-lg">${b('Supplemental Medical','補充醫療保障')}</h3>
   ${spec(b('Ward upgrade & surgery','病房差額與手術'),b('Reimbursed','實支實付'))}${spec(b('NHI out-of-pocket gap','健保自費缺口'),b('Covered within limit','限額內補足'))}${spec(b('Emergency & clinic visits','急診與門診'),b('Accident-related','意外相關'))}</div></section>

  <section id="calc" class="bg-black text-white px-5 py-8"><h2 class="hd text-2xl">${b('Premium & Payout Calculator','保費與理賠試算')}</h2>
  <label class="block mt-5 text-sm"><div class="flex justify-between"><span>${b('Monthly budget','每月預算')}</span><b>NT$<span id="bv"></span></b></div>
   <input type="range" min="100" max="500" step="50" value="${B}" oninput="B=+this.value;calc()"></label>
  <label class="block mt-5 text-sm"><div class="flex justify-between"><span>${b('Accident coverage limit','意外保額上限')}</span><b>NT$<span id="lv"></span></b></div>
   <input type="range" min="200000" max="1000000" step="100000" value="${LM}" oninput="LM=+this.value;calc()"></label>
  <div id="cres" class="mt-5 bg-white text-black p-4 text-sm"></div>
  <p class="text-[10px] text-neutral-400 mt-2">${b('Illustrative model only. Not an offer or a quote; confirm with a certified advisor.','僅為示意模型,非報價或要約,請與合格業務員確認。')}</p></section>

  <section class="bg-red-600 text-white px-5 py-8"><h2 class="hd text-2xl">${b('Fast-Track Application','學生快速投保申請')}</h2>
  <p class="text-sm mt-2">${b('Four fields, under a minute. Your code and agent details arrive in LINE.','只要四個欄位,一分鐘完成。折扣碼與顧問資訊會傳到 LINE。')}</p>
  <button onclick="applyM(true)" class="w-full mt-4 bg-black text-white font-black py-3.5 text-sm">${b('Submit Application & Lock 20% Discount','送出申請並鎖定 8 折優惠')}</button></section>
  <section class="px-5 py-8"><h2 class="hd text-2xl">${b('Douliu / Yunlin Advisor','斗六/雲林在地顧問')}</h2>
  <div class="mt-4 border-l-4 border-red-600 pl-4 text-sm space-y-1"><div class="font-black">${L(CFG.name)}</div><div>📍 ${L(CFG.addr)}</div><div>🕘 ${L(CFG.hours)}</div><div>📞 ${CFG.phone}</div></div>
  <div class="grid grid-cols-2 gap-2 mt-4"><a href="tel:${CFG.phone.replace(/[^0-9]/g,'')}" class="text-center bg-black text-white font-bold py-3 text-sm">${b('Call advisor','撥打專員')}</a>
  <a href="${CFG.line}" target="_blank" rel="noopener" class="text-center bg-red-600 text-white font-bold py-3 text-sm">${b('Chat on LINE','LINE 諮詢')}</a></div>
  <button onclick="closeP()" class="w-full mt-6 border-2 border-black font-black py-3 text-sm">${b('← Back to Game','← 返回遊戲')}</button></section></div>`;
  calc()}
let AP={n:'',s:'',m:'',l:''},APcode=null;
function applyM(open){
  if(open){APcode=null;$('apply').classList.remove('hidden')}
  const fld=(k,lb,ph,ty)=>`<label class="block text-xs font-bold mt-3">${lb}<input value="${AP[k].replace(/"/g,'&quot;')}" oninput="AP.${k}=this.value" type="${ty||'text'}" ${ty=='tel'?'inputmode="numeric"':''} placeholder="${ph}" class="mt-1 w-full border-2 border-neutral-300 px-3 py-2.5 text-sm font-normal outline-none focus:border-red-600"></label>`;
  $('apply').innerHTML=`<div class="w-full max-w-[400px] max-h-[92vh] overflow-auto bg-white text-black p-5 border-t-4 border-red-600">`+(APcode?
  `<div class="text-center"><div class="text-5xl">✅</div><h3 class="hd text-2xl mt-2">${b('Application Submitted!','申請已送出!')}</h3>
   <p class="text-sm mt-2 leading-relaxed">${b('Your 20% Discount Code & Cardif Agent Contact Details have been sent to your LINE Chat.','您的 8 折優惠碼與 Cardif 業務顧問聯絡資訊已傳送至您的 LINE 聊天室。')}</p>
   <div class="mt-4 bg-black text-white py-3 font-black tracking-widest text-xl">${APcode}</div>
   <div class="mt-4 border-l-4 border-red-600 pl-3 text-left text-xs space-y-1"><div class="font-black text-sm">${L(CFG.name)}</div><div>📞 ${CFG.phone}</div><div>🕘 ${L(CFG.hours)}</div></div>
   <button onclick="$('apply').classList.add('hidden')" class="w-full mt-5 bg-red-600 text-white font-black py-3 text-sm">${b('Done','完成')}</button></div>`:
  `<h3 class="hd text-2xl">${b('Fast-Track Student Application','學生快速投保申請')}</h3><p class="text-xs text-neutral-500 mt-1">${b('Lock your 20% discount for the first 3 months.','鎖定前 3 個月 8 折優惠。')}</p>
   ${fld('n',b('Name','姓名'),b('Full name','真實姓名'))}${fld('s',b('Student ID / School Name','學號/學校名稱'),b('e.g. B11023001 / YunTech','例:B11023001/雲林科技大學'))}${fld('m',b('Mobile Number','手機號碼'),'09XX-XXX-XXX','tel')}${fld('l',b('LINE ID','LINE ID'),'@your_line_id')}
   <div id="aperr" class="text-xs text-red-600 font-bold mt-3 min-h-[1rem]"></div>
   <button onclick="submitApp()" class="w-full mt-2 bg-red-600 text-white font-black py-3 text-sm">${b('Submit Application & Lock 20% Discount','送出申請並鎖定 8 折優惠')}</button>
   <button onclick="$('apply').classList.add('hidden')" class="w-full mt-2 border-2 border-black font-bold py-2.5 text-sm">${b('Cancel','取消')}</button>`)+`</div>`}
function submitApp(){
  const ph=AP.m.replace(/[\s-]/g,'');let e='';
  if(!AP.n.trim()||!AP.s.trim()||!AP.l.trim())e=b('Please fill in all fields.','請填寫所有欄位。');
  else if(!/^09\d{8}$/.test(ph))e=b('Enter a valid mobile number (09XXXXXXXX).','請輸入正確手機號碼(09XXXXXXXX)。');
  if(e){$('aperr').textContent=e;return}
  APcode='CDF20-'+Math.random().toString(36).slice(2,7).toUpperCase();
  sendApplication({name:AP.n.trim(),school:AP.s.trim(),mobile:ph,lineId:AP.l.trim(),code:APcode});
  applyM()}
// ★ TODO: POST the application to your backend and push the code via LINE Messaging API.
// Inside LIFF, this tries to drop the code into the chat; nothing is stored or sent elsewhere yet.
function sendApplication(d){try{if(window.liff&&liff.isInApp&&liff.isInApp())liff.sendMessages([{type:'text',text:'Cardif 20% OFF code: '+d.code+' | '+CFG.phone}])}catch(x){console.warn(x)}}
function closeP(){$('portal').classList.add('hidden')}
function calc(){
  const ap=Math.round(LM*.0004),rd=B-ap;$('bv').textContent=n(B);$('lv').textContent=n(LM);
  if(rd<=0){$('cres').innerHTML=`<b class="text-red-600">${b('Budget too low for this limit.','預算不足以負擔此保額。')}</b> ${b('Lower the limit or raise the budget (needs over NT$'+n(ap)+').','請降低保額或提高預算(需高於 NT$'+n(ap)+')。')}`;return}
  const med=rd*600,cs=[[b('Ankle sprain + therapy','腳踝扭傷+復健'),6000],[b('Scooter fracture, 3-day stay','機車骨折住院 3 天'),48000],[b('ER visit (NHI gap)','急診自費缺口'),12000]];
  $('cres').innerHTML=`<div class="flex justify-between"><span>${b('Accident plan / month','意外險/月')}</span><b>NT$${n(ap)}</b></div>
  <div class="flex justify-between"><span>${b('Medical rider / month','醫療附約/月')}</span><b>NT$${n(rd)}</b></div>
  <div class="flex justify-between border-b pb-2 mb-2"><span>${b('Medical limit','醫療給付上限')}</span><b>${m(med)}</b></div>
  ${cs.map(([k,c])=>{const r=Math.min(c,med);return `<div class="py-1.5 border-b border-neutral-200"><div class="font-bold">${k} (${m(c)})</div><div class="flex justify-between text-xs"><span class="text-green-700">${b('Payout','理賠')} ${m(r)}</span><span class="text-red-600">${b('You pay','自付')} ${m(c-r)}</span></div></div>`}).join('')}
  <div class="flex justify-between pt-2"><span>${b('Disability lump sum (10% grade)','失能一次金(10% 等級)')}</span><b>${m(LM*.1)}</b></div>`}

render();startM();
</script>
