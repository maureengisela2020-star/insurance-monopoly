.tk{position:absolute;bottom:2px;left:0;right:0;display:flex;justify-content:center;gap:3px}
.tk i{width:10px;height:10px;border-radius:50%;box-shadow:0 0 7px 2px currentColor;background:currentColor}
@keyframes pop{from{transform:scale(.5) rotate(-90deg)}to{transform:none}}
.dice{animation:pop .3s}
#portal{background:#fff;color:#111}
#portal input[type=range]{accent-color:#cc0000;width:100%}
.hd{font-style:italic;font-weight:900;letter-spacing:-.02em}
html[data-lap="1"]{--bg:#0b1020;--panel:#121a33;--line:#243056;--on:#1b2650}
html[data-lap="2"]{--bg:#170a2b;--panel:#26123f;--line:#d97706;--on:#4c1d95}
html[data-lap="3"]{--bg:#07161c;--panel:#0f2730;--line:#c9a227;--on:#16414d}
html,body{transition:background .9s}
.tile{transition:background .7s,border-color .7s}
.gb{border-radius:12px;box-shadow:0 0 0 2px var(--line),0 0 26px -8px var(--line);transition:box-shadow .9s}
main .bg-slate-900{background:var(--panel)}
main .border-slate-700{border-color:var(--line)}
.lapcard{background:rgba(5,8,20,.93);border:2px solid;border-radius:20px;padding:20px 28px;text-align:center;animation:lapin 1.9s ease both}
@keyframes lapin{0%{opacity:0;transform:scale(.7)}15%{opacity:1;transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:scale(1.06)}}
.cube{width:46px;height:46px;position:relative;transform-style:preserve-3d}
.cf{position:absolute;inset:0;background:linear-gradient(135deg,#fff,#cbd5e1);border-radius:9px;display:grid;grid:repeat(3,1fr)/repeat(3,1fr);padding:6px;box-shadow:inset 0 0 6px rgba(0,0,0,.25)}
.cf i{width:8px;height:8px;border-radius:50%;margin:auto;background:#0f172a}
.cf.f1 i{background:#ef4444;width:10px;height:10px}
.f1{transform:translateZ(23px)}.f2{transform:rotateY(90deg) translateZ(23px)}.f3{transform:rotateX(90deg) translateZ(23px)}
.f4{transform:rotateX(-90deg) translateZ(23px)}.f5{transform:rotateY(-90deg) translateZ(23px)}.f6{transform:rotateY(180deg) translateZ(23px)}
@media(prefers-reduced-motion:reduce){.dice{animation:none}}

/* ---------- Game flow ---------- */
async function roll(){
  if(busy||!G)return;busy=true;const p=G.P[G.t];
  sfx('roll');const d=1+Math.floor(Math.random()*6),[rx,ry]=FR[d];G.d=0;render();
  const cu=$('cube');cu.style.transition='none';void cu.offsetWidth;
  cu.style.transition='transform .8s cubic-bezier(.12,.75,.2,1)';
  cu.style.transform=`rotateX(${rx+720}deg) rotateY(${ry+1080}deg)`;
  await sleep(850);G.d=d;G.face=d;render();await sleep(250);
  for(let s=0;s<G.d;s++){p.pos++;if(p.pos>=16){p.pos=0;p.laps++;p.cash+=8000;lapFx(p);
      lg(p,'Passed START: +NT$8,000 allowance.','經過起點:領取生活費 +NT$8,000。');
      if(p.ins){p.cash-=200;p.pd+=200;lg(p,'Cardif premium -NT$200 (per lap).','Cardif 保費 -NT$200(每圈)。')}
      render();if(p.laps>=3)break}
    render();await sleep(210)}
  await land(p);
  if(p.laps>=3)p.done=true;
  if(G.P.every(x=>x.done))return finish();
  do{G.t=(G.t+1)%G.P.length}while(G.P[G.t].done);
  busy=false;render();
  if(G.P[G.t].ai){busy=true;render();await sleep(700);busy=false;roll()}
}
async function hit(p,pos){

  else{p.cash-=c;lg(p,`${t[0]}: out-of-pocket -${m(c)}.`,`${t[1]}:自費支出 -${m(c)}。`);

   ${fld('n',b('Name','姓名'),b('Full name','真實姓名'))}${fld('s',b('Student ID / School Name','學號/學校名稱'),b('e.g. B11023001 / YunTech','例:B11023001/雲林科技大學'))}${fld('m',b('Mobile Number','手機號碼'),'09XX-XXX-XXX','tel')}${fld('l',b('LINE ID','LINE ID'),'@your_line_id')}
   <div id="aperr" class="text-xs text-red-600 font-bold mt-3 min-h-[1rem]"></div>
   <button onclick="submitApp()" class="w-full mt-2 bg-red-600 text-white font-black py-3 text-sm">${b('Submit Application & Lock 20% Discount','送出申請並鎖定 8 折優惠')}</button>

function submitApp(){
  const ph=AP.m.replace(/[\s-]/g,'');let e='';
  if(!AP.n.trim()||!AP.s.trim()||!AP.l.trim())e=b('Please fill in all fields.','請填寫所有欄位。');
  else if(!/^09\d{8}$/.test(ph))e=b('Enter a valid mobile number (09XXXXXXXX).','請輸入正確手機號碼(09XXXXXXXX)。');
  if(e){$('aperr').textContent=e;return}
  APcode='CDF20-'+Math.random().toString(36).slice(2,7).toUpperCase();
  sendApplication({name:AP.n.trim(),school:AP.s.trim(),mobile:ph,lineId:AP.l.trim(),code:APcode});
  applyM()}

function calc(){

/* ---------- Web Audio synth (no audio files) ---------- */
let AC=null,muted=false;try{muted=localStorage.getItem('imMute')=='1'}catch(e){}
function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume()}catch(e){}return AC}
function tone(f,t0,d,type,v,f2){const a=ac();if(!a||muted)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
function noise(t0,d,v,fq,ty){const a=ac();if(!a||muted)return;const k=a.sampleRate*d|0,bf=a.createBuffer(1,k,a.sampleRate),x=bf.getChannelData(0);
  for(let i=0;i<k;i++)x[i]=Math.random()*2-1;const sr=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain(),t=a.currentTime+t0;
  sr.buffer=bf;fl.type=ty||'highpass';fl.frequency.value=fq;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  sr.connect(fl);fl.connect(g);g.connect(a.destination);sr.start(t)}
const SFX={
  lap(){[523,659,880].forEach((f,i)=>tone(f,i*.08,.3,'triangle',.1));tone(1175,.3,.5,'sine',.1)},
  roll(){[0,.07,.15,.24,.35,.48,.62,.78].forEach(t=>{noise(t,.035,.2,2200+Math.random()*1500);tone(280+Math.random()*320,t,.03,'square',.04)})},
  chime(){[880,1175,1568].forEach((f,i)=>tone(f,i*.09,.4,'sine',.12))},
  thud(){tone(150,0,.4,'sine',.4,40);noise(0,.15,.25,300,'lowpass')},
  shield(){tone(523,0,.5,'triangle',.12);tone(784,.1,.5,'triangle',.12);tone(1047,.2,.8,'sine',.1)},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.13,.22,'square',.07));[523,659,784,1047].forEach(f=>tone(f,.6,1,'triangle',.09))},
  end(){[392,494,587].forEach((f,i)=>tone(f,i*.16,.25,'triangle',.1));[392,494,587,784].forEach(f=>tone(f,.55,.9,'triangle',.08))}};
const SND={'🛡️':'shield','💥':'thud','🍀':'chime','💰':'chime','🎓':'chime','✅':'chime','🏥':'chime'};
function sfx(k){try{if(SFX[k])SFX[k]()}catch(e){}}

const LIFF_ID='YOUR_LIFF_ID';let liffOK=false;
async function initLiff(){try{if(!window.liff||LIFF_ID=='YOUR_LIFF_ID')throw 0;await liff.init({liffId:LIFF_ID});liffOK=true}catch(e){liffOK=false}}
function result(){const s=G.P.map(sc),mx=Math.max(...s),w=G.P.filter((p,i)=>s[i]==mx),tie=w.length>1,wp=w[0];
  return{s,won:!tie&&!wp.ai,title:tie?['Game Complete: Tie!','遊戲結束:平手!']:wp.ai?['Game Complete!','遊戲結束!']:[pn(wp)[0]+' Wins!',pn(wp)[1]+' 獲勝!']}}
async function copyURL(u){try{await navigator.clipboard.writeText(u);return 1}catch(e){try{const t=document.createElement('textarea');t.value=u;document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();return ok}catch(x){return 0}}}
async function shareResult(){
  const r=result(),url=(liffOK&&liff.permanentLink)?liff.permanentLink.createUrl():location.href.split('#')[0];
  const rows=G.P.map((p,i)=>({type:'box',layout:'horizontal',contents:[{type:'text',text:L(pn(p))+(p.ins?' 🛡️':''),flex:3,size:'sm',color:'#111111'},{type:'text',text:n(r.s[i])+' '+b('pts','分'),flex:2,align:'end',size:'sm',weight:'bold',color:i?'#db2777':'#0891b2'}]}));
  if(r.won)rows.push({type:'text',text:'🎟️ '+b('20% OFF first 3 months unlocked','前 3 個月 8 折已解鎖'),size:'xs',weight:'bold',color:'#cc0000',margin:'md',wrap:true});
  const msg={type:'flex',altText:L(r.title)+' '+n(Math.max(...r.s))+' '+b('pts','分'),contents:{type:'bubble',size:'mega',
    header:{type:'box',layout:'vertical',backgroundColor:'#111111',paddingAll:'16px',contents:[
      {type:'text',text:'CARDIF × '+b('1-1 INSURANCE MONOPOLY','1-1 保險大富翁'),color:'#ffffff',size:'xs',weight:'bold'},
      {type:'text',text:(r.won?'🏆 ':'🏁 ')+L(r.title),color:'#ffffff',size:'xl',weight:'bold',margin:'md',wrap:true}]},
    body:{type:'box',layout:'vertical',spacing:'sm',paddingAll:'16px',contents:[
      {type:'text',text:b('Final scoreboard','最終計分板'),size:'xs',color:'#888888'},...rows,{type:'separator',margin:'md'},
      {type:'text',text:b('Cash + Lifestyle × 50 + 5,000 if insured','現金 + 生活點數 × 50 + 已投保 5,000'),size:'xxs',color:'#999999',wrap:true,margin:'md'}]},
    footer:{type:'box',layout:'vertical',contents:[{type:'button',style:'primary',color:'#cc0000',height:'sm',action:{type:'uri',label:b('Beat my score','來挑戰我的分數'),uri:url}}]}}};
  try{if(liffOK&&liff.isApiAvailable&&liff.isApiAvailable('shareTargetPicker')){
      const res=await liff.shareTargetPicker([msg]);
      if(res&&res.status=='success')toast(`<div class="font-bold">✅ ${b('Shared to LINE!','已分享到 LINE!')}</div>`);return}}catch(e){console.warn(e);}
  const ok=await copyURL(url);
  toast(`<div class="font-bold">🔗 ${ok?b('Link copied. Paste it into LINE!','已複製連結,貼到 LINE 分享吧!'):b('Copy this link: ','請複製連結:')+url}</div>`)}
